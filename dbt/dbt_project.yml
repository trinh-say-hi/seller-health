name: 'seller_health'
version: '1.0.0'
config-version: 2

profile: 'seller_health'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  seller_health:
    staging:
      +materialized: view
      +schema: stg
    intermediate:
      +materialized: view
      +schema: stg
    marts:
      core:
        +materialized: table
        +schema: core
      analytics:
        +materialized: table
        +schema: mart
