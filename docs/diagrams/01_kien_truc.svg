<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" font-family="Segoe UI, system-ui, sans-serif"><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8a8983"/></marker></defs><rect width="1400" height="560" fill="#ffffff"/><text x="20" y="30" font-size="18" font-weight="600" fill="#0b0b0b" text-anchor="start">Kiến trúc Seller Health: Medallion cho các lớp, Kimball cho mô hình trong Gold</text><rect x="20" y="60" width="150" height="165" rx="7" fill="#f4f4f1" stroke="#8a8983" stroke-width="1"/><text x="29" y="78" font-size="13" font-weight="600" fill="#0b0b0b">Nguồn</text><text x="29" y="94" font-size="11.5" fill="#52514e">9 file CSV Olist</text><text x="29" y="109" font-size="11.5" fill="#52514e">manifest kiểm tra hash</text><text x="29" y="124" font-size="11.5" fill="#52514e">Giả lập 26 đợt tháng</text><rect x="196" y="60" width="195" height="165" rx="7" fill="#f6e3d2" stroke="#8a8983" stroke-width="1"/><text x="205" y="78" font-size="13" font-weight="600" fill="#0b0b0b">Bronze: raw</text><text x="205" y="94" font-size="11.5" fill="#52514e">Loại: bảng</text><text x="205" y="109" font-size="11.5" fill="#52514e">Nạp: theo đợt, nối thêm</text><text x="205" y="124" font-size="11.5" fill="#52514e">Biến đổi: không</text><text x="205" y="139" font-size="11.5" fill="#52514e">Thêm cột dwh_</text><text x="205" y="154" font-size="11.5" fill="#52514e">Đơn có nhiều phiên bản</text><text x="205" y="169" font-size="11.5" fill="#52514e">Mô hình: như nguồn</text><rect x="417" y="60" width="215" height="165" rx="7" fill="#e8e7e3" stroke="#8a8983" stroke-width="1"/><text x="426" y="78" font-size="13" font-weight="600" fill="#0b0b0b">Silver: stg</text><text x="426" y="94" font-size="11.5" fill="#52514e">Loại: view + bảng master</text><text x="426" y="109" font-size="11.5" fill="#52514e">Nạp: giao dịch là view</text><text x="426" y="124" font-size="11.5" fill="#52514e">Biến đổi: ép kiểu, làm sạch</text><text x="426" y="139" font-size="11.5" fill="#52514e">thành phố, tọa độ, gộp review</text><text x="426" y="154" font-size="11.5" fill="#52514e">Lỗi: vào ops.quarantine</text><text x="426" y="169" font-size="11.5" fill="#52514e">Mô hình: như nguồn, đã sạch</text><rect x="658" y="60" width="215" height="165" rx="7" fill="#fbeec4" stroke="#8a8983" stroke-width="1"/><text x="667" y="78" font-size="13" font-weight="600" fill="#0b0b0b">Gold: core</text><text x="667" y="94" font-size="11.5" fill="#52514e">Loại: bảng</text><text x="667" y="109" font-size="11.5" fill="#52514e">Nạp: thêm, cập nhật, SCD2</text><text x="667" y="124" font-size="11.5" fill="#52514e">Biến đổi: khóa thay thế, số đo</text><text x="667" y="139" font-size="11.5" fill="#52514e">Mô hình: galaxy schema</text><text x="667" y="154" font-size="11.5" fill="#52514e">8 dimension, 6 fact</text><text x="667" y="169" font-size="11.5" fill="#52514e">Đủ 3 kiểu fact</text><rect x="899" y="60" width="205" height="165" rx="7" fill="#f7e2a0" stroke="#8a8983" stroke-width="1"/><text x="908" y="78" font-size="13" font-weight="600" fill="#0b0b0b">Gold: mart</text><text x="908" y="94" font-size="11.5" fill="#52514e">Loại: bảng</text><text x="908" y="109" font-size="11.5" fill="#52514e">Nạp: đóng băng lúc chốt đợt</text><text x="908" y="124" font-size="11.5" fill="#52514e">Biến đổi: tổng hợp, CUBE</text><text x="908" y="139" font-size="11.5" fill="#52514e">feature seller, KPI, tuyến</text><text x="908" y="154" font-size="11.5" fill="#52514e">Mô hình: bảng phẳng</text><rect x="1130" y="60" width="170" height="165" rx="7" fill="#cde2fb" stroke="#8a8983" stroke-width="1"/><text x="1139" y="78" font-size="13" font-weight="600" fill="#0b0b0b">DSS: dss</text><text x="1139" y="94" font-size="11.5" fill="#52514e">Nhãn, Logistic Regression</text><text x="1139" y="109" font-size="11.5" fill="#52514e">Bảng luật, MILP</text><text x="1139" y="124" font-size="11.5" fill="#52514e">Kế hoạch, đánh giá</text><line x1="170" y1="142" x2="196" y2="142" stroke="#8a8983" stroke-width="1.2" marker-end="url(#a)"/><line x1="391" y1="142" x2="417" y2="142" stroke="#8a8983" stroke-width="1.2" marker-end="url(#a)"/><line x1="632" y1="142" x2="658" y2="142" stroke="#8a8983" stroke-width="1.2" marker-end="url(#a)"/><line x1="873" y1="142" x2="899" y2="142" stroke="#8a8983" stroke-width="1.2" marker-end="url(#a)"/><line x1="1104" y1="142" x2="1130" y2="142" stroke="#8a8983" stroke-width="1.2" marker-end="url(#a)"/><rect x="196" y="290" width="908" height="74" rx="7" fill="#e8e7e3" stroke="#8a8983" stroke-width="1"/><text x="205" y="308" font-size="13" font-weight="600" fill="#0b0b0b">Vận hành: ops</text><text x="205" y="324" font-size="11.5" fill="#52514e">Cổng chất lượng: mỗi đợt 11 phép đối soát số dòng và số tiền giữa các lớp. Lệch thì dừng đợt, ghi failed, watermark không tiến.</text><text x="205" y="339" font-size="11.5" fill="#52514e">etl_log: nhật ký đợt · quarantine: dòng lỗi có mã · dq_issue: bất thường và cách xử lý · source_manifest: nguồn gốc file</text><line x1="293.5" y1="225" x2="293.5" y2="290" stroke="#8a8983" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><line x1="524.5" y1="225" x2="524.5" y2="290" stroke="#8a8983" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><line x1="765.5" y1="225" x2="765.5" y2="290" stroke="#8a8983" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><line x1="1001.5" y1="225" x2="1001.5" y2="290" stroke="#8a8983" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="196" y="420" width="1160" height="110" rx="7" fill="#d5efe3" stroke="#8a8983" stroke-width="1"/><text x="205" y="438" font-size="13" font-weight="600" fill="#0b0b0b">Ứng dụng Streamlit: chỉ đọc Gold, DSS, ops</text><text x="205" y="454" font-size="11.5" fill="#52514e">Tổng quan · Lỗi giao trễ · Chi tiết seller: phân tích, drill-down theo as-of</text><text x="205" y="469" font-size="11.5" fill="#52514e">Bảng kế hoạch: kéo thả, tối ưu lại theo ngân sách và số suất · What-if tuyến: hứa thêm N ngày · Kiểm chứng: so với các cách chọn đơn giản</text><text x="205" y="484" font-size="11.5" fill="#52514e">Chú thích từng chỉ số lấy từ metrics.yml</text><line x1="999" y1="225" x2="999" y2="420" stroke="#8a8983" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><line x1="1215" y1="225" x2="1215" y2="420" stroke="#8a8983" stroke-width="1.2" marker-end="url(#a)"/></svg>