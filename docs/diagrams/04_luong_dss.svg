xt x="319" y="139" font-size="11.5" fill="#52514e">mart.seller_features</text><text x="319" y="154" font-size="11.5" fill="#52514e">Đóng băng lúc chốt</text><text x="319" y="169" font-size="11.5" fill="#52514e">12 chỉ số</text><rect x="475" y="105" width="150" height="95" rx="7" fill="#cde2fb" stroke="#8a8983" stroke-width="1"/><text x="484" y="123" font-size="13" font-weight="600" fill="#0b0b0b">Nhãn</text><text x="484" y="139" font-size="11.5" fill="#52514e">dss.labels</text><text x="484" y="154" font-size="11.5" fill="#52514e">45 ngày sau as-of</text><text x="484" y="169" font-size="11.5" fill="#52514e">Train cuốn</text><rect x="640" y="105" width="150" height="95" rx="7" fill="#cde2fb" stroke="#8a8983" stroke-width="1"/><text x="649" y="123" font-size="13" font-weight="600" fill="#0b0b0b">Mô hình</text><text x="649" y="139" font-size="11.5" fill="#52514e">Logistic Regression</text><text x="649" y="154" font-size="11.5" fill="#52514e">p_decline</text><text x="649" y="169" font-size="11.5" fill="#52514e">p_dormant</text><rect x="800" y="105" width="165" height="95" rx="7" fill="#cde2fb" stroke="#8a8983" stroke-width="1"/><text x="809" y="123" font-size="13" font-weight="600" fill="#0b0b0b">Bảng luật</text><text x="809" y="139" font-size="11.5" fill="#52514e">Rủi ro × giá trị × vận hành</text><text x="809" y="154" font-size="11.5" fill="#52514e">Phân khúc</text><text x="809" y="169" font-size="11.5" fill="#52514e">Lý do bằng chữ</text><rect x="975" y="105" width="165" height="95" rx="7" fill="#cde2fb" stroke="#8a8983" stroke-width="1"/><text x="984" y="123" font-size="13" font-weight="600" fill="#0b0b0b">Tối ưu MILP</text><text x="984" y="139" font-size="11.5" fill="#52514e">Ngân sách, số suất</text><text x="984" y="154" font-size="11.5" fill="#52514e">Tối đa 1 hành động</text><text x="984" y="169" font-size="11.5" fill="#52514e">mỗi seller</text><rect x="1150" y="105" width="230" height="95" rx="7" fill="#d5efe3" stroke="#8a8983" stroke-width="1"/><text x="1159" y="123" font-size="13" font-weight="600" fill="#0b0b0b">Bảng kế hoạch</text><text x="1159" y="139" font-size="11.5" fill="#52514e">Người dùng kéo thả, sửa đề xuất</text><text x="1159" y="154" font-size="11.5" fill="#52514e">Cảnh báo vượt ràng buộc</text><text x="1159" y="169" font-size="11.5" fill="#52514e">Xuất CSV</text><line x1="460" y1="152" x2="475" y2="152" stroke="#8a8983" stroke-width="1.2" marker-end="url(#a)"/><line x1="625" y1="152" x2="640" y2="152" stroke="#8a8983" stroke-width="1.2" marker-end="url(#a)"/><line x1="790" y1="152" x2="800" y2="152" stroke="#8a8983" stroke-width="1.2" marker-end="url(#a)"/><line x1="965" y1="152" x2="975" y2="152" stroke="#8a8983" stroke-width="1.2" marker-end="url(#a)"/><line x1="1140" y1="152" x2="1150" y2="152" stroke="#8a8983" stroke-width="1.2" marker-end="url(#a)"/><rect x="800" y="250" width="340" height="72" rx="7" fill="#fdecec" stroke="#8a8983" stroke-width="1"/><text x="809" y="268" font-size="13" font-weight="600" fill="#0b0b0b">Giả định (không có trong dữ liệu)</text><text x="809" y="284" font-size="11.5" fill="#52514e">Chi phí và hiệu quả can thiệp</text><text x="809" y="299" font-size="11.5" fill="#52514e">Người dùng đổi được, có phân tích độ nhạy</text><line x1="970" y1="250" x2="1057" y2="200" stroke="#8a8983" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="1150" y="250" width="230" height="72" rx="7" fill="#d5efe3" stroke="#8a8983" stroke-width="1"/><text x="1159" y="268" font-size="13" font-weight="600" fill="#0b0b0b">What-if</text><text x="1159" y="284" font-size="11.5" fill="#52514e">Đổi ràng buộc: tính lại kế hoạch</text><text x="1159" y="299" font-size="11.5" fill="#52514e">Tuyến: hứa thêm N ngày</text><line x1="1265" y1="250" x2="1265" y2="200" stroke="#8a8983" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="310" y="360" width="830" height="80" rx="7" fill="#e8e7e3" stroke="#8a8983" stroke-width="1"/><text x="319" y="378" font-size="13" font-weight="600" fill="#0b0b0b">Kiểm chứng trên các tháng đã biết</text><text x="319" y="394" font-size="11.5" fill="#52514e">So với chọn theo GMV, số ngày không bán, luật đơn giản, ngẫu nhiên. Tham số chọn trên 09/2017–02/2018, báo cáo trên 03–07/2018.</text><text x="319" y="409" font-size="11.5" fill="#52514e">Chỉ đo được seller có sụt thật hay không, chưa đo được can thiệp có hiệu quả.</text><line x1="1057" y1="200" x2="1057" y2="250" stroke="#ffffff" stroke-width="1.2"/><line x1="715" y1="200" x2="715" y2="360" stroke="#8a8983" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/></svg>